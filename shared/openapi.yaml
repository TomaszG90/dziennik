components:
  securitySchemes:
    http:
      type: http
      scheme: bearer
  schemas:
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
      required:
        - email
      title: ForgotPasswordRequest
    GeocodeResource:
      type: object
      properties:
        name:
          type:
            - string
            - "null"
        latitude:
          type:
            - string
            - "null"
        longitude:
          type:
            - string
            - "null"
        street:
          type:
            - string
            - "null"
        housenumber:
          type:
            - string
            - "null"
        postcode:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        district:
          type:
            - string
            - "null"
        county:
          type:
            - string
            - "null"
        state:
          type:
            - string
            - "null"
        country:
          type:
            - string
            - "null"
        country_code:
          type:
            - string
            - "null"
      required:
        - name
        - latitude
        - longitude
        - street
        - housenumber
        - postcode
        - city
        - district
        - county
        - state
        - country
        - country_code
      title: GeocodeResource
    LegResource:
      type: object
      properties:
        id:
          type: integer
        trip_id:
          type: integer
        from_place_id:
          type: integer
        to_place_id:
          type: integer
        transport:
          type: string
        distance:
          type:
            - string
            - "null"
        geometry:
          type:
            - object
            - "null"
          properties:
            type:
              type: string
              const: LineString
            coordinates:
              type: array
              items:
                type: array
                prefixItems:
                  - type: number
                  - type: number
                minItems: 2
                maxItems: 2
          required:
            - type
            - coordinates
        position:
          type: integer
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - trip_id
        - from_place_id
        - to_place_id
        - transport
        - distance
        - geometry
        - position
        - created_at
        - updated_at
      title: LegResource
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
      title: LoginRequest
    PlaceResource:
      type: object
      properties:
        id:
          type: integer
        trip_id:
          type: integer
        name:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        position:
          type: integer
        country_code:
          type:
            - string
            - "null"
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - trip_id
        - name
        - latitude
        - longitude
        - position
        - country_code
        - created_at
        - updated_at
      title: PlaceResource
    PublicUserResource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        city:
          type: string
        birth_date:
          type:
            - string
            - "null"
        avatar_path:
          type: string
        created_at:
          type: string
      required:
        - id
        - created_at
      title: PublicUserResource
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
        profile_visibility:
          type: string
          enum:
            - public
            - private
        password_confirmation:
          type: string
      required:
        - name
        - email
        - password
        - profile_visibility
        - password_confirmation
      title: RegisterRequest
    ReorderPlacesRequest:
      type: object
      properties:
        place_ids:
          type: array
          items:
            type: integer
          minItems: 1
          uniqueItems: true
      required:
        - place_ids
      title: ReorderPlacesRequest
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
        password_confirmation:
          type: string
      required:
        - token
        - email
        - password
        - password_confirmation
      title: ResetPasswordRequest
    StatsResource:
      type: object
      properties:
        trips_count:
          type: integer
        countries:
          type: string
        total_distance:
          type: number
        distance_by_transport:
          type: string
        places_count:
          type: integer
      required:
        - trips_count
        - countries
        - total_distance
        - distance_by_transport
        - places_count
      title: StatsResource
    StoreLegRequest:
      type: object
      properties:
        from_place_id:
          type: integer
        to_place_id:
          type: integer
        transport:
          type: string
          enum:
            - walking
            - car
            - plane
            - train
            - other
      required:
        - from_place_id
        - to_place_id
        - transport
      title: StoreLegRequest
    StorePlaceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        country_code:
          type:
            - string
            - "null"
          minLength: 2
          maxLength: 2
      required:
        - name
        - latitude
        - longitude
      title: StorePlaceRequest
    StoreTripRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        start_date:
          type: string
          format: date-time
        end_date:
          type:
            - string
            - "null"
          format: date-time
        description:
          type:
            - string
            - "null"
      required:
        - name
        - start_date
      title: StoreTripRequest
    TripResource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        start_date:
          type: string
        end_date:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - name
        - start_date
        - end_date
        - description
        - created_at
        - updated_at
      title: TripResource
    UpdateLegRequest:
      type: object
      properties:
        from_place_id:
          type: integer
        to_place_id:
          type: integer
        transport:
          type: string
          enum:
            - walking
            - car
            - plane
            - train
            - other
      title: UpdateLegRequest
    UpdatePlaceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        country_code:
          type:
            - string
            - "null"
          minLength: 2
          maxLength: 2
      title: UpdatePlaceRequest
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
        profile_visibility:
          type: string
          enum:
            - public
            - private
        first_name:
          type:
            - string
            - "null"
          maxLength: 255
        last_name:
          type:
            - string
            - "null"
          maxLength: 255
        city:
          type:
            - string
            - "null"
          maxLength: 255
        birth_date:
          type:
            - string
            - "null"
          format: date-time
        avatar_path:
          type: string
          enum:
            - 1.png
            - 2.png
            - 3.png
            - 4.png
            - 5.png
            - 6.png
            - 7.png
            - 8.png
            - 9.png
            - 10.png
        privacy_settings:
          type: object
          properties:
            name:
              type: boolean
            email:
              type: boolean
            firstName:
              type: boolean
            lastName:
              type: boolean
            city:
              type: boolean
            birthDate:
              type: boolean
            avatar:
              type: boolean
        password_confirmation:
          type: string
      title: UpdateProfileRequest
    UpdateTripRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        start_date:
          type: string
          format: date-time
        end_date:
          type:
            - string
            - "null"
          format: date-time
        description:
          type:
            - string
            - "null"
      title: UpdateTripRequest
    UserResource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        first_name:
          type:
            - string
            - "null"
        last_name:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        birth_date:
          type:
            - string
            - "null"
        avatar_path:
          type:
            - string
            - "null"
        profile_visibility:
          type: string
        privacy_settings:
          type: array
