openapi: 3.1.2
info:
  title: Dziennik Podróży API
  version: 1.0.0
  description: Wersjonowane REST API aplikacji Dziennik Podróży.
servers:
  - url: http://localhost/api/v1
security:
  - http: []
paths:
  /health:
    get:
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  timestamp:
                    type: string
                required:
                  - status
                  - timestamp
      security: []
  /auth/register:
    post:
      operationId: auth.register
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "`UserResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserResource"
                required:
                  - data
        "422":
          $ref: "#/components/responses/ValidationException"
      security: []
  /auth/login:
    post:
      operationId: auth.login
      summary: Login a user and return token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/UserResource"
                      token:
                        type: string
                    required:
                      - user
                      - token
                required:
                  - data
        "422":
          $ref: "#/components/responses/ValidationException"
      security: []
  /auth/logout:
    post:
      operationId: auth.logout
      summary: Logout the current user
      tags:
        - Auth
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Successfully logged out
                required:
                  - message
        "401":
          $ref: "#/components/responses/AuthenticationException"
  /geocode:
    get:
      operationId: geocode
      summary: Search for places using geocoding service
      tags:
        - Geocode
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 255
      responses:
        "200":
          description: Array of `GeocodeResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GeocodeResource"
                required:
                  - data
        "422":
          $ref: "#/components/responses/ValidationException"
      security: []
  /trips/{trip}/legs:
    get:
      operationId: leg.index
      tags:
        - Leg
      parameters:
        - name: trip
          in: path
          required: true
          description: The trip ID
          schema:
            type: integer
      responses:
        "200":
          description: Array of `LegResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LegResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
    post:
      operationId: leg.store
      tags:
        - Leg
      parameters:
        - name: trip
          in: path
          required: true
          description: The trip ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreLegRequest"
      responses:
        "201":
          description: "`LegResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LegResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
        "422":
          $ref: "#/components/responses/ValidationException"
  /trips/{trip}/legs/{leg}:
    get:
      operationId: leg.show
      tags:
        - Leg
      parameters:
        - name: trip
          in: path
          required: true
          description: The trip ID
          schema:
            type: integer
        - name: leg
          in: path
          required: true
          description: The leg ID
          schema:
            type: integer
      responses:
        "200":
          description: "`LegResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LegResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
    patch:
      operationId: leg.update
      tags:
        - Leg
      parameters:
        - name: trip
          in: path
          required: true
          description: The trip ID
          schema:
            type: integer
        - name: leg
          in: path
          required: true
          description: The leg ID
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLegRequest"
      responses:
        "200":
          description: "`LegResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LegResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
        "422":
          $ref: "#/components/responses/ValidationException"
    delete:
      operationId: leg.destroy
      tags:
        - Leg
      parameters:
        - name: trip
          in: path
          required: true
          description: The trip ID
          schema:
            type: integer
        - name: leg
          in: path
          required: true
          description: The leg ID
          schema:
            type: integer
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
  /map:
    get:
      operationId: map
      summary: Return all map data for the authenticated user's trips
      tags:
        - Map
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      trips:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            start_date:
                              type:
                                - string
                                - "null"
                            end_date:
                              type:
                                - string
                                - "null"
                          required:
                            - id
                            - name
                            - start_date
                            - end_date
                      places:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            trip_id:
                              type: integer
                            trip_name:
                              type: string
                            name:
                              type: string
                            latitude:
                              type:
                                - string
                                - "null"
                            longitude:
                              type:
                                - string
                                - "null"
                            position:
                              type: integer
                            country_code:
                              type:
                                - string
                                - "null"
                          required:
                            - id
                            - trip_id
                            - trip_name
                            - name
                            - latitude
                            - longitude
                            - position
                            - country_code
                      legs:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            trip_id:
                              type: integer
                            trip_name:
                              type: string
                            from_place_id:
                              type: integer
                            to_place_id:
                              type: integer
                            transport:
                              type: string
                            distance:
                              type:
                                - string
                                - "null"
                            geometry:
                              type:
                                - object
                                - "null"
                              properties:
                                type:
                                  type: string
                                  const: LineString
                                coordinates:
                                  type: array
                                  items:
                                    type: array
                                    prefixItems:
                                      - type: number
                                      - type: number
                                    minItems: 2
                                    maxItems: 2
                              required:
                                - type
                                - coordinates
                            position:
                              type: integer
                          required:
                            - id
                            - trip_id
                            - trip_name
                            - from_place_id
                            - to_place_id
                            - transport
                            - distance
                            - geometry
                            - position
                    required:
                      - trips
                      - places
                      - legs
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
  /forgot-password:
    post:
      operationId: passwordReset.sendResetLink
      tags:
        - PasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Jeśli konto z podanym adresem istnieje, otrzymasz wiadomość z linkiem do zmiany hasła.
                required:
                  - message
        "422":
          $ref: "#/components/responses/ValidationException"
      security: []
  /reset-password:
    post:
      operationId: passwordReset.reset
      tags:
        - PasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    const: Hasło zostało zmienione.
                required:
                  - message
        "422":
          $ref: "#/components/responses/ValidationException"
      security: []
  /trips/{trip}/places:
    get:
      operationId: place.index
      tags:
        - Place
      parameters:
        - name: trip
          in: path
          required: true
          description: The trip ID
          schema:
            type: integer
      responses:
        "200":
          description: Array of `PlaceResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlaceResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
    post:
      operationId: place.store
      tags:
        - Place
      parameters:
        - name: trip
          in: path
          required: true
          description: The trip ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorePlaceRequest"
      responses:
        "201":
          description: "`PlaceResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PlaceResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
        "422":
          $ref: "#/components/responses/ValidationException"
  /trips/{trip}/places/reorder:
    patch:
      operationId: place.reorder
      tags:
        - Place
      parameters:
        - name: trip
          in: path
          required: true
          description: The trip ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderPlacesRequest"
      responses:
        "200":
          description: Array of `PlaceResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlaceResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
        "422":
          $ref: "#/components/responses/ValidationException"
  /trips/{trip}/places/{place}:
    get:
      operationId: place.show
      tags:
        - Place
      parameters:
        - name: trip
          in: path
          required: true
          description: The trip ID
          schema:
            type: integer
        - name: place
          in: path
          required: true
          description: The place ID
          schema:
            type: integer
      responses:
        "200":
          description: "`PlaceResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PlaceResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
    patch:
      operationId: place.update
      tags:
        - Place
      parameters:
        - name: trip
          in: path
          required: true
          description: The trip ID
          schema:
            type: integer
        - name: place
          in: path
          required: true
          description: The place ID
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaceRequest"
      responses:
        "200":
          description: "`PlaceResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PlaceResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
        "422":
          $ref: "#/components/responses/ValidationException"
    delete:
      operationId: place.destroy
      tags:
        - Place
      parameters:
        - name: trip
          in: path
          required: true
          description: The trip ID
          schema:
            type: integer
        - name: place
          in: path
          required: true
          description: The place ID
          schema:
            type: integer
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
  /me:
    get:
      operationId: profile.show
      summary: Get the authenticated user's profile
      tags:
        - Profile
      responses:
        "200":
          description: "`UserResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
    patch:
      operationId: profile.update
      summary: Update the authenticated user's profile
      tags:
        - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: "`UserResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "422":
          $ref: "#/components/responses/ValidationException"
  /public/users:
    get:
      operationId: publicProfile.index
      tags:
        - PublicProfile
      parameters:
        - name: search
          in: query
          required: false
          description: Search public name, first name, last name, or city fields only.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Paginated set of `PublicUserResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicUserResource"
                  links:
                    type: object
                    properties:
                      first:
                        type:
                          - string
                          - "null"
                      last:
                        type:
                          - string
                          - "null"
                      prev:
                        type:
                          - string
                          - "null"
                      next:
                        type:
                          - string
                          - "null"
                    required:
                      - first
                      - last
                      - prev
                      - next
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        minimum: 1
                      from:
                        type:
                          - integer
                          - "null"
                        minimum: 1
                      last_page:
                        type: integer
                        minimum: 1
                      links:
                        type: array
                        description: Generated paginator links.
                        items:
                          type: object
                          properties:
                            url:
                              type:
                                - string
                                - "null"
                            label:
                              type: string
                            active:
                              type: boolean
                          required:
                            - url
                            - label
                            - active
                      path:
                        type:
                          - string
                          - "null"
                        description: Base path for paginator generated URLs.
                      per_page:
                        type: integer
                        description: Number of items shown per page.
                        minimum: 0
                      to:
                        type:
                          - integer
                          - "null"
                        description: Number of the last item in the slice.
                        minimum: 1
                      total:
                        type: integer
                        description: Total number of items being paginated.
                        minimum: 0
                    required:
                      - current_page
                      - from
                      - last_page
                      - links
                      - path
                      - per_page
                      - to
                      - total
                required:
                  - data
                  - links
                  - meta
      security: []
  /public/users/{user}:
    get:
      operationId: publicProfile.show
      tags:
        - PublicProfile
      parameters:
        - name: user
          in: path
          required: true
          description: The user ID
          schema:
            type: integer
      responses:
        "200":
          description: "`PublicUserResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PublicUserResource"
                required:
                  - data
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
      security: []
  /public/users/{user}/trips:
    get:
      operationId: publicProfile.trips
      tags:
        - PublicProfile
      parameters:
        - name: user
          in: path
          required: true
          description: The user ID
          schema:
            type: integer
      responses:
        "200":
          description: Array of `TripResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TripResource"
                required:
                  - data
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
      security: []
  /public/users/{user}/map:
    get:
      operationId: publicProfile.map
      tags:
        - PublicProfile
      parameters:
        - name: user
          in: path
          required: true
          description: The user ID
          schema:
            type: integer
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      trips:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            start_date:
                              type: string
                            end_date:
                              type:
                                - string
                                - "null"
                          required:
                            - id
                            - name
                            - start_date
                            - end_date
                      places:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            trip_id:
                              type: string
                            trip_name:
                              type: string
                            name:
                              type: string
                            latitude:
                              type: string
                            longitude:
                              type: string
                            position:
                              type: string
                            country_code:
                              type: string
                          required:
                            - id
                            - trip_id
                            - trip_name
                            - name
                            - latitude
                            - longitude
                            - position
                            - country_code
                      legs:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            trip_id:
                              type: string
                            trip_name:
                              type: string
                            from_place_id:
                              type: string
                            to_place_id:
                              type: string
                            transport:
                              type: string
                            distance:
                              type: string
                            geometry:
                              type: string
                            position:
                              type: string
                          required:
                            - id
                            - trip_id
                            - trip_name
                            - from_place_id
                            - to_place_id
                            - transport
                            - distance
                            - geometry
                            - position
                    required:
                      - trips
                      - places
                      - legs
                required:
                  - data
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
      security: []
  /public/users/{user}/stats:
    get:
      operationId: publicProfile.stats
      tags:
        - PublicProfile
      parameters:
        - name: user
          in: path
          required: true
          description: The user ID
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
            minimum: 1901
            maximum: 2026
      responses:
        "200":
          description: "`StatsResource`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StatsResource"
                required:
                  - data
        "404":
          $ref: "#/components/responses/ModelNotFoundException"
        "422":
          $ref: "#/components/responses/ValidationException"
      security: []
  /stats:
    get:
      operationId: stats.index
      summary: Return statistics for the authenticated user's trips
      tags:
        - Stats
      parameters:
        - name: year
          in: query
          schema:
            type:
              - integer
              - "null"
            minimum: 1900
            maximum: 2027
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      trips_count:
                        type: integer
                      countries:
                        type: array
                        items:
                          type: string
                      total_distance:
                        type: number
                      distance_by_transport:
                        type: object
                        additionalProperties:
                          type: number
                      places_count:
                        type: integer
                    required:
                      - trips_count
                      - countries
                      - total_distance
                      - distance_by_transport
                      - places_count
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "422":
          $ref: "#/components/responses/ValidationException"
  /trips:
    get:
      operationId: trips.index
      summary: List trips belonging to the authenticated user
      tags:
        - Trip
      responses:
        "200":
          description: Array of `TripResource`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TripResource"
                required:
                  - data
        "401":
          $ref: "#/components/responses/AuthenticationException"
        "403":
          $ref: "#/components/responses/AuthorizationException"
    post:
      operationId: trips.store
